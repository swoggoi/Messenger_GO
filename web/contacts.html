<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141414">
  <title>БипЧат — контакты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail" data-active="contacts.html"></nav>
    <main class="page">
      <h1>Контакты</h1>
      <p class="sub">Найдите зарегистрированных студентов по имени, username или почте</p>
      <div class="search page-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input class="input" id="q" autocomplete="off" aria-label="Поиск пользователей по имени, @username или почте">
      </div>
      <div class="list" id="filterable" aria-live="polite"></div>
      <div class="empty" id="empty">Пользователи не найдены</div>
      <div class="list-title">Мои контакты <span class="muted" id="saved-count"></span></div>
      <div class="list" id="saved-contacts"></div>
    </main>
  </div>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
