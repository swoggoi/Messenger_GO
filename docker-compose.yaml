services:
  app:
    build: .
    container_name: messenger-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - messenger-net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: messenger-db
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger_pass
      POSTGRES_DB: messenger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger -d messenger_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - messenger-net

  redis:
    image: redis:alpine
    container_name: messenger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - messenger-net

  kafka:
    profiles: ["kafka"]
    image: apache/kafka:latest
    container_name: messenger-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    networks:
      - messenger-net

networks:
  messenger-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: